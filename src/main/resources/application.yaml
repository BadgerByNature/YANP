spring:
  application:
    name: YANP
  datasource:
    url: 'jdbc:mariadb://localhost:3310/'
    username: root
    password: 123456
  jpa:
    open-in-view: false
auth:
  port: 3724
  strictVersionCheck: true
  realmsUpdateIntervalSeconds: 30
io:
  netty:
    leakDetection:
      level: paranoid # TODO Turn this back down to advanced or simple after some testing
logging:
  level:
    com.woodlands.yanp: INFO
    com.woodlands.yanp.auth: DEBUG
    root: INFO
server:
  port: 8081 # WebServer port